<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowl - Poki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 4em;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(255, 215, 0, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #00FF00;
            font-size: 1.5em;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .play-button {
            padding: 25px 50px;
            font-size: 1.5em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #FF6B35 0%, #FF4500 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
            text-decoration: none;
            display: inline-block;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(255, 107, 53, 0.6);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00FF00;
            padding: 20px;
            border-radius: 10px;
            margin-top: 40px;
            color: #00FF00;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .emoji {
            font-size: 1.2em;
            margin: 0 5px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .play-button {
                padding: 20px 40px;
                font-size: 1.2em;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏈 RETRO BOWL 🏈</h1>
        <p class="subtitle">Lead your team to championship glory!</p>

        <div class="button-container">
            <a href="https://poki.com/en/g/retro-bowl" class="play-button" target="_blank">
                ▶ PLAY NOW
            </a>
        </div>

        <div class="info-box">
            <p><span class="emoji">🎮</span> Click the button above to play Retro Bowl on Poki.com</p>
            <p><span class="emoji">📱</span> Works on desktop, tablet, and mobile devices</p>
            <p><span class="emoji">⭐</span> No download required - play instantly in your browser!</p>
        </div>
    </div>
</body>
</html>
