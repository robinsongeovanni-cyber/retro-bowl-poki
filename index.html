<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowl - Play Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3em;
            color: #FFD700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(255, 215, 0, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #00FF00;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 75%;
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid #FFD700;
        }

        .game-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .info {
            text-align: center;
            color: #00FF00;
            margin-top: 30px;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }

            .game-wrapper {
                padding-bottom: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏈 RETRO BOWL 🏈</h1>
            <p class="subtitle">Lead your team to championship glory!</p>
        </div>

        <div class="game-wrapper">
            <iframe src="https://retrobowl.cn/" allowfullscreen="true"></iframe>
        </div>

        <div class="info">
            <p>🎮 Play Retro Bowl directly in your browser • No downloads needed • Works on all devices</p>
        </div>
    </div>
</body>
</html>
